manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: DoctorWangWang
      url-base: https://github.com/DoctorWangWang

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml

    # ↓これが重要（ZMKのboardsを有効化）
    - name: zmk-boards
      remote: zmkfirmware
      revision: main
      path: modules/zmk

    - name: zmk-pmw3610-driver
      remote: DoctorWangWang
      revision: main

  self:
    path: config
